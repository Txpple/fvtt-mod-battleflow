# The static gate on every push: the same `npm run verify` a session runs before committing
# (Biome, knip, tsc, the architecture checks, the unit tests). The live smoke suites need the
# sandbox and are not run here.
name: verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      # A commit whose subject starts "comments:" must leave the code identical.
      - run: node tools/check-comment-only.mjs --range "${{ github.event.before }}..${{ github.sha }}"
        if: github.event_name == 'push'
